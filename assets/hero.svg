<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f1419"/><stop offset=".6" stop-color="#0d1f24"/><stop offset="1" stop-color="#1a1416"/></linearGradient>
<radialGradient id="blob" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fffbe6"/><stop offset=".3" stop-color="#ffcc33"/><stop offset=".7" stop-color="#00d4bf" stop-opacity=".5"/><stop offset="1" stop-color="#00d4bf" stop-opacity="0"/></radialGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="fan"><path d="M150 250 L560 60 L560 440 Z"/></clipPath>
<pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0 L0 0 0 22" fill="none" stroke="#25343b" stroke-width="1"/></pattern>
</defs>
<rect width="1200" height="420" fill="url(#bg)"/>
<!-- road -->
<path d="M0 360 L1200 330 L1200 420 L0 420 Z" fill="#141c20"/>
<path d="M0 384 L1200 360" stroke="#ffcc33" stroke-width="2" stroke-dasharray="26 22" opacity=".5"><animate attributeName="stroke-dashoffset" values="0;-96" dur="2.4s" repeatCount="indefinite"/></path>
<!-- base station -->
<g filter="url(#glow)">
<path d="M142 360 L150 250 L158 360" fill="none" stroke="#8ca1ab" stroke-width="4"/>
<rect x="138" y="236" width="24" height="30" rx="3" fill="#00d4bf"/>
<rect x="143" y="242" width="14" height="3" fill="#0f1419"/><rect x="143" y="249" width="14" height="3" fill="#0f1419"/><rect x="143" y="256" width="14" height="3" fill="#0f1419"/>
</g>
<!-- radar wavefronts toward the car -->
<g clip-path="url(#fan)" fill="none" stroke="#00d4bf" stroke-width="3">
<circle cx="150" cy="250" r="20" opacity="0"><animate attributeName="r" values="20;420" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".9;0" dur="2.4s" repeatCount="indefinite"/></circle>
<circle cx="150" cy="250" r="20" opacity="0"><animate attributeName="r" values="20;420" dur="2.4s" begin=".8s" repeatCount="indefinite"/><animate attributeName="opacity" values=".9;0" dur="2.4s" begin=".8s" repeatCount="indefinite"/></circle>
<circle cx="150" cy="250" r="20" opacity="0"><animate attributeName="r" values="20;420" dur="2.4s" begin="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values=".9;0" dur="2.4s" begin="1.6s" repeatCount="indefinite"/></circle>
</g>
<!-- car -->
<g transform="translate(470 300)">
<g><animateTransform attributeName="transform" type="translate" values="0 0;-40 1;0 0" dur="6s" repeatCount="indefinite"/>
<path d="M0 40 L8 18 L34 8 L80 8 L104 22 L122 26 L124 40 Z" fill="#ff6b61"/>
<path d="M38 13 L76 13 L94 23 L30 23 Z" fill="#0f1419" opacity=".7"/>
<circle cx="26" cy="42" r="9" fill="#0f1419" stroke="#8ca1ab" stroke-width="3"/><circle cx="98" cy="42" r="9" fill="#0f1419" stroke="#8ca1ab" stroke-width="3"/>
<!-- echo -->
<g fill="none" stroke="#ff6b61" stroke-width="2.5">
<path d="M-6 20 Q-20 -10 -6 -40" opacity="0"><animate attributeName="opacity" values="0;.9;0" dur="2.4s" begin=".9s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 0;-150 -40" dur="2.4s" begin=".9s" repeatCount="indefinite"/></path>
<path d="M-6 20 Q-20 -10 -6 -40" opacity="0"><animate attributeName="opacity" values="0;.9;0" dur="2.4s" begin="1.7s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 0;-150 -40" dur="2.4s" begin="1.7s" repeatCount="indefinite"/></path>
</g></g></g>
<!-- data to the phone -->
<g transform="translate(330 120)">
<rect x="0" y="0" width="26" height="46" rx="5" fill="#ffcc33"/><rect x="4" y="5" width="18" height="30" rx="2" fill="#0f1419"/>
<text x="13" y="26" font-family="Consolas, monospace" font-size="11" fill="#ffcc33" text-anchor="middle">16Q</text>
</g>
<g font-family="Consolas, monospace" font-size="15" font-weight="bold" fill="#ffcc33">
<text x="0" y="0">1011<animateMotion path="M165 240 L330 140" dur="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="1.8s" repeatCount="indefinite"/></text>
<text x="0" y="0">0110<animateMotion path="M165 240 L330 140" dur="1.8s" begin=".6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="1.8s" begin=".6s" repeatCount="indefinite"/></text>
<text x="0" y="0">1100<animateMotion path="M165 240 L330 140" dur="1.8s" begin="1.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="1.8s" begin="1.2s" repeatCount="indefinite"/></text>
</g>
<!-- range-Doppler panel -->
<g transform="translate(700 58)">
<rect width="430" height="250" rx="10" fill="#0b1013" stroke="#25343b" stroke-width="2"/>
<rect x="20" y="20" width="390" height="210" fill="url(#grid)"/>
<line x1="215" y1="20" x2="215" y2="230" stroke="#25343b" stroke-width="2"/>
<g opacity=".55" fill="#00d4bf"><rect x="20" y="186" width="390" height="10"/><rect x="209" y="20" width="12" height="210"/></g>
<circle cx="215" cy="191" r="26" fill="url(#blob)"><animate attributeName="r" values="24;28;24" dur="2.4s" repeatCount="indefinite"/></circle>
<circle cx="120" cy="150" r="20" fill="url(#blob)"><animate attributeName="cx" values="120;100;120" dur="6s" repeatCount="indefinite"/><animate attributeName="cy" values="150;168;150" dur="6s" repeatCount="indefinite"/></circle>
<circle cx="222" cy="105" r="12" fill="url(#blob)" opacity=".8"><animate attributeName="opacity" values=".4;.9;.4" dur="3s" repeatCount="indefinite"/></circle>
<circle cx="285" cy="72" r="18" fill="url(#blob)"/>
<circle cx="250" cy="46" r="9" fill="url(#blob)" opacity=".7"/>
<text x="215" y="246" font-family="Segoe UI, Helvetica, Arial" font-size="13" fill="#8ca1ab" text-anchor="middle">radial velocity →</text>
<text x="10" y="128" font-family="Segoe UI, Helvetica, Arial" font-size="13" fill="#8ca1ab" transform="rotate(-90 10 128)" text-anchor="middle">range →</text>
</g>
<text x="40" y="58" font-family="Segoe UI, Helvetica, Arial" font-size="40" font-weight="800" fill="#e6f2f5">One waveform, two jobs</text>
<text x="42" y="92" font-family="Segoe UI, Helvetica, Arial" font-size="18" fill="#00d4bf">the 5G data frame for the phone is also the radar pulse for the street</text>
<text x="700" y="345" font-family="Consolas, monospace" font-size="14" fill="#8ca1ab">28 GHz · 1024 × 256 OFDM · 122.88 MHz · 1.22 m · 2.34 m/s</text>
</svg>
